packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@prisma/engines": true
  argon2: true
  cpu-features: true
  prisma: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    - GHSA-ggr8-5vv4-36mx
    - GHSA-3f6p-5ww8-9rcr
    - GHSA-rgwj-5xj2-c3m3
    # braces(GHSA-vfj7-8cjw-p6xm): 2026-10-03時点で修正版なし(3.0.3が最新)。
    # eslint-config-next > fast-glob > micromatch 経由のdevDependencyのみで、
    # lint時にリポジトリ内の固定globを展開するだけでユーザー入力は渡らず、runtimeへ同梱されない。
    # 修正版が出たら本ignoreを削除する。
    - GHSA-vfj7-8cjw-p6xm
# T-101 Task5(2026-10-01): eslint/testcontainers/prismaのdevDependencyチェーン経由で
# 古いtranstive依存が解決されていたため、既知の修正済みバージョンへ強制固定する。
# 上限なしのrange(">=x")は使わない: 別majorの依存先(例: eslint本体が使うminimatch@3系の
# brace-expansion@1系)まで巻き込んで最新majorへ引き上げてしまい、古いAPIを前提にした
# 呼び出し元を壊すため、各majorを個別に exact pin する。
overrides:
  brace-expansion@1: "1.1.21"
  brace-expansion@2: "2.1.7"
  brace-expansion@5: "5.0.12"
  fast-uri: "3.1.8"
  "@grpc/grpc-js": "1.14.5"
  # GHSA-68fv-2mgg-jv7q: next/vite が使う postcss 経由の source-map-js を修正版へ固定(2026-10-06)。
  source-map-js: "1.2.2"
  # GHSA-wq5f-xc86-pv6w: next が同梱する sharp(<0.35.5、librsvg の脆弱性)を修正版へ固定(2026-10-09)。
  sharp: "0.35.5"
minimumReleaseAgeExclude:
  - zod@4.6.5
  - "@next/env@16.3.8"
  - "@next/swc-darwin-arm64@16.3.8"
  - "@next/swc-darwin-x64@16.3.8"
  - "@next/swc-linux-arm64-gnu@16.3.8"
  - "@next/swc-linux-arm64-musl@16.3.8"
  - "@next/swc-linux-x64-gnu@16.3.8"
  - "@next/swc-linux-x64-musl@16.3.8"
  - "@next/swc-win32-arm64-msvc@16.3.8"
  - "@next/swc-win32-x64-msvc@16.3.8"
  - next@16.3.8
