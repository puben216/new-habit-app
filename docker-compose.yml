services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: habit_app
      POSTGRES_PASSWORD: habit_app
      POSTGRES_DB: habit_app_dev
    ports:
      # 他のプロジェクトと重ならないよう、ホスト側の既定は一般的でない 19435(コンテナ内は 5432)。
      # 変更は POSTGRES_PORT(E2E は E2E_POSTGRES_PORT。両方を同じ値にする)。ローカルからのみ接続できるよう loopback に bind する。
      - "127.0.0.1:${POSTGRES_PORT:-19435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit_app -d habit_app_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ローカル/CI 専用の SMTP キャプチャ(ADR-010)。アプリの DB とは独立で、データは永続化しない。
  # ホスト側の既定は他のプロジェクトと重ならない値: SMTP は 19025(コンテナ内は 1025)、Web UI と HTTP API は
  # 19026(コンテナ内は 8025)。変更は MAILPIT_SMTP_PORT / MAILPIT_HTTP_PORT(E2E は E2E_MAILPIT_SMTP_PORT /
  # E2E_MAILPIT_HTTP_PORT。アプリの SMTP_PORT も揃える)。ローカルからのみ接続できるよう loopback に bind する。
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-19025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-19026}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
