services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: habit_app
      POSTGRES_PASSWORD: habit_app
      POSTGRES_DB: habit_app_dev
    ports:
      # 他のプロジェクトと重なりにくいよう、ホスト側の既定は 5435(コンテナ内は 5432)。変更は POSTGRES_PORT
      # (E2E は E2E_POSTGRES_PORT。両方を同じ値にする)。
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit_app -d habit_app_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ローカル/CI 専用の SMTP キャプチャ(ADR-010)。アプリの DB とは独立で、データは永続化しない。
  # SMTP は 1025、Web UI と HTTP API はホスト側 8026(コンテナ内は 8025)。他のプロジェクトと重なる場合は
  # MAILPIT_SMTP_PORT / MAILPIT_HTTP_PORT で変更できる(E2E は E2E_MAILPIT_SMTP_PORT / E2E_MAILPIT_HTTP_PORT。
  # アプリの SMTP_PORT も揃える)。ローカルからのみ接続できるよう loopback に bind する。
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
