services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: habit_app
      POSTGRES_PASSWORD: habit_app
      POSTGRES_DB: habit_app_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit_app -d habit_app_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ローカル/CI 専用の SMTP キャプチャ(ADR-010)。アプリの DB とは独立で、データは永続化しない。
  # SMTP は 1025、Web UI と HTTP API は 8025。ローカルからのみ接続できるよう loopback に bind する。
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
