services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: habit_app
      POSTGRES_PASSWORD: habit_app
      POSTGRES_DB: habit_app_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit_app -d habit_app_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
