name: PR Quality Gate

# T-005 (docs/09-roadmap.md): PRのquality gate。
# staging deployは存在しないため対象外(T-501以降で追加)。Terraformはfmt/validateのみ(T-402)。
# plan/policy as code/tflintは認証情報と共通基盤が必要なためT-501で追加する。
# E2E(T-211、ADR-010)はsecretを使わない独立jobで実行する。fork PRにもsecretを渡さない
# (pull_requestイベントのみ。pull_request_targetは使わない)。
on:
  pull_request:
    branches:
      - main

# 同一PRへの連続pushで古い実行を止め、runnerとキャッシュ帯域を節約する。
concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# fork PRを含め、既定は読み取り専用。書き込みが必要なjob/stepでのみ個別に昇格する。
permissions:
  contents: read

jobs:
  quality:
    name: format / lint / typecheck / build / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # versionは指定しない: package.jsonのpackageManagerフィールド(pnpm@12.4.1)から自動検出する。
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: format:check
        run: pnpm format:check

      - name: lint
        run: pnpm lint

      - name: lint:boundaries
        run: pnpm lint:boundaries

      - name: typecheck
        run: pnpm typecheck

      - name: build
        run: pnpm build

      - name: test:unit
        run: pnpm test:unit

      # GitHub-hosted ubuntu runnerはDockerを標準搭載しており、Testcontainers
      # (@habit-app/test-support)がpostgres:16-alpineコンテナを自前で起動するため、
      # 追加の `services:` Postgresブロックは不要(ローカルで動作確認済み)。
      - name: test:integration
        run: pnpm test:integration

  # T-402: Terraform(infra/)のfmtとvalidate。AWS認証情報は使わず、backendにも接続しない
  # (`init -backend=false`)。providerのダウンロードのみ外部通信が発生する。plan/applyはしない。
  terraform:
    name: terraform (fmt / validate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive infra

      - name: terraform init (backend なし)
        working-directory: infra/environments/dev
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: infra/environments/dev
        run: terraform validate

  # T-211(ADR-010): Playwright E2E。quality jobとは独立させ、E2Eの不安定さがquality gateに影響しないようにする。
  # AUTH_SECRET等はapps/web/e2e/support/e2e-env.tsの公開してよいダミー値で、secretは参照しない。
  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # E2E専用databaseはplaywright.config.tsのwebServerが作り直す(開発用databaseは使わない)。
      - name: Start Postgres and Mailpit
        run: docker compose up -d --wait postgres mailpit

      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: test:e2e
        run: pnpm test:e2e
