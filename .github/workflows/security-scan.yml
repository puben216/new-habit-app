name: Security Scan

# T-005 (docs/09-roadmap.md): 現時点で現実的に導入できるsecurity/supply-chain check。
# Terraform/IaC scan、SBOM生成、staging deployはインフラ未着手のため対象外(T-501以降)。
# SAST(Semgrep/CodeQL等)は、Auth/API(T-101〜)未実装で攻撃面が薄いため今回は対象外
# (T-101 Auth adapter着手時に導入を再検討)。依存方向チェックはlint:boundaries
# (dependency-cruiser)としてpr-quality.ymlに既に導入済み。
on:
  pull_request:
    branches:
      - main

concurrency:
  group: security-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# fork PRを含め、既定は読み取り専用。
permissions:
  contents: read

jobs:
  secret-scan:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # GITHUB_TOKENはActionsが実行ごとに発行する短命tokenで、長期secretではない。
          # fork PRではAPI書込み権限が既定で失われるため、PRへのコメント機能は
          # 明示的に無効化し、workflowへwrite権限を要求しない(secretをfork PRへ渡さない)。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-audit:
    name: pnpm audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # moderate以上を必須ゲートにする。既知3件(Prisma CLI自身が同梱する開発時専用の
      # 依存prisma>mysql2, prisma>@prisma/config>deepmerge-ts由来。実行時バンドルには
      # 含まれず、2026-09-15時点で修正版が未リリース)は`pnpm-workspace.yaml`の
      # `auditConfig.ignoreGhsas`にレビュー済みとして記録済み(詳細はPR説明に記載)。
      # 新規に混入する脆弱性はここで検知しmergeを止める。
      - name: pnpm audit
        run: pnpm audit --audit-level=moderate
